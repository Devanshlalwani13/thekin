<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kin - Questionnaire</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Open+Sans:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        :root { --main-green: #1e3000; --outline-grey: #f4f1eb; --text-yellow: #fffadd; --font-main: 'Open Sans', sans-serif; }
        body.form-body {
            background-color: var(--main-green); margin: 0; padding: 0; display: flex; flex-direction: column;
            min-height: 100vh; align-items: center; position: static; overflow: auto;
            opacity: 0;
            transition: opacity 0.6s ease-out;
        }
        body.form-body.visible {
            opacity: 1;
        }
        .form-page-container { 
            width: 100%; max-width: 800px; flex-grow: 1; padding: 20px; padding-top: 80px; position: relative;
            transform: translateY(20px);
            transition: transform 0.6s ease-out;
        }
        body.form-body.visible .form-page-container {
            transform: translateY(0);
        }
        .back-btn.form-back {
            position: fixed; top: 25px; right: 25px; z-index: 10; border-radius: 25px; padding: 6px 20px;
            font-size: 0.85rem; color: var(--outline-grey); border-color: var(--outline-grey);
            opacity: 0;
            transition: opacity 0.3s ease-out, background-color 0.3s ease;
        }
        body.form-body.visible .back-btn.form-back {
            opacity: 1;
            transition-delay: 0.3s;
        }
        .back-btn.form-back:hover { background-color: rgba(244, 241, 235, 0.1); color: var(--outline-grey); }
        iframe { 
            border: none; width: 100%; min-height: 85vh; border-radius: 5px;
            opacity: 0;
            transition: opacity 1s ease-out;
        }
        body.form-body.visible iframe {
            opacity: 1;
            transition-delay: 0.3s;
        }
        .loading-placeholder {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: var(--text-yellow);
            font-family: var(--font-main);
            opacity: 1;
            transition: opacity 0.3s ease-out;
        }
        body.form-body.visible .loading-placeholder {
            opacity: 0;
        }
    </style>
</head>
<body class="form-body">
    <a href="index.html#signup" class="back-btn form-back">← back</a>
    <div class="form-page-container">
        <div class="loading-placeholder">Loading form...</div>
        <iframe src="https://docs.google.com/forms/d/e/1FAIpQLSeTYoBQVAat7K9oWp19z5UBWXMgSCtfYMPGtRGDXPinIEjsag/viewform?embedded=true" frameborder="0" marginheight="0" marginwidth="0" onload="this.parentElement.parentElement.classList.add('visible')"></iframe>
    </div>

    <script>
        // Add loading state management
        document.addEventListener('DOMContentLoaded', () => {
            // If iframe is already loaded when this runs
            const iframe = document.querySelector('iframe');
            if (iframe.complete) {
                document.body.classList.add('visible');
            }
        });
    </script>
</body>
</html>
